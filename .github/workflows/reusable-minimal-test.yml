name: Reusable Minimal Test
on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      ecr_repository:
        required: true
        type: string
      gitops_repo:
        required: true
        type: string
      service_name:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      ci_role_arn:
        required: true
        type: string
      docker_context:
        required: false
        type: string
        default: "."
      gitops_manifest_path:
        required: false
        type: string
        default: ""
      gitops_branch:
        required: false
        type: string
        default: "main"
      image_tag:
        required: false
        type: string
        default: ""
    secrets:
      gitops_token:
        required: true

env:
  AWS_REGION: ${{ inputs.aws_region }}
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  build-and-push:
    name: "Build & push ${{ inputs.image_name }}"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      ecr_registry: test-registry

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build
        id: build-image
        run: echo "image=test:tag" >> $GITHUB_OUTPUT

  update-gitops:
    name: "Update GitOps — ${{ inputs.service_name }}"
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout GitOps
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops_repo }}
          token: ${{ secrets.gitops_token }}
          ref: ${{ inputs.gitops_branch }}
      - name: Update
        run: echo "Updating manifest"
      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@test.com"
          echo "ok"
