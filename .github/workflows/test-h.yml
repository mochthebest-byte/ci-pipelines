name: Reusable Minimal Test
on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      ecr_repository:
        required: true
        type: string
      gitops_repo:
        required: true
        type: string
      service_name:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      ci_role_arn:
        required: true
        type: string
      docker_context:
        required: false
        type: string
        default: "."
      gitops_manifest_path:
        required: false
        type: string
        default: ""
      gitops_branch:
        required: false
        type: string
        default: "main"
      image_tag:
        required: false
        type: string
        default: ""
    secrets:
      gitops_token:
        required: true

env:
  AWS_REGION: ${{ inputs.aws_region }}
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  build-and-push:
    name: "Build & push ${{ inputs.image_name }}"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      ecr_registry: test-registry

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.ci_role_arn }}
          aws-region: ${{ inputs.aws_region }}
      - name: Login
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          echo "Building ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG                        -t $ECR_REGISTRY/$ECR_REPOSITORY:latest                        "${{ inputs.docker_context }}"
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "registry=$ECR_REGISTRY" >> $GITHUB_OUTPUT

  update-gitops:
    name: "Update GitOps — ${{ inputs.service_name }}"
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout GitOps
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops_repo }}
          token: ${{ secrets.gitops_token }}
          ref: ${{ inputs.gitops_branch }}
      - name: Update image tag in k8s manifest
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.ecr_registry }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          MANIFEST_PATH: ${{ inputs.gitops_manifest_path || format('apps/{0}/deployment.yaml', inputs.service_name) }}
        run: |
          NEW_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "Updating ${MANIFEST_PATH} -> image: ${NEW_IMAGE}"
          if grep -q "^image:" "${MANIFEST_PATH}"; then
            sed -i "s|image:.*${ECR_REPOSITORY}:.*|image: ${NEW_IMAGE}|g" "${MANIFEST_PATH}"
          elif grep -q "^  tag:" "${MANIFEST_PATH}"; then
            sed -i "s|^  tag:.*|  tag: ${IMAGE_TAG}|g" "${MANIFEST_PATH}"
          else
            sed -i "s|image:.*${ECR_REPOSITORY}:.*|image: ${NEW_IMAGE}|g" "${MANIFEST_PATH}"
          fi
          echo "Updated:"
          grep -E "(image:|  tag:)" "${MANIFEST_PATH}" || echo "(no image/tag line found)"
      - name: Commit and push changes
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(${SERVICE_NAME}): bump image to ${IMAGE_TAG}

Automated by CI pipeline."
          git push origin ${{ inputs.gitops_branch }}
          echo "Pushed to ${{ inputs.gitops_repo }}:${{ inputs.gitops_branch }}"
